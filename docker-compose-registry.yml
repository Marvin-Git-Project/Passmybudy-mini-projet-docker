services:

  # Service 1 : Registry Docker privé
  # ----------------------------------------------
  registry:
    image: registry:2
    container_name: registry
    # Port exposé vers l'hôte pour pouvoir pusher les images depuis le terminal
    ports:
      - "5000:5000"
    environment:
      # Permet la suppression d'images depuis l'interface graphique
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # Les headers CORS sont supprimés : inutiles car l'UI communique
      # avec le registry via le proxy Nginx interne (même domaine)
    volumes:
      - registry_data:/var/lib/registry
    restart: always

  # Service 2 : Interface graphique du Registry (joxit)
  # -------------------------------------------------
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    ports:
      - "8081:80"
    environment:
      REGISTRY_TITLE: "My Docker Registry"
      # REGISTRY_URL supprimé : il forçait le navigateur à appeler http://localhost:5000
      # ce qui causait une erreur MIXED_CONTENT (page HTTPS -> appel HTTP bloqué)

      # À la place, on utilise NGINX_PROXY_PASS_URL :
      # Le Nginx interne du conteneur proxifie les requêtes vers le registry
      # via le réseau Docker (communication conteneur à conteneur)
      NGINX_PROXY_PASS_URL: "http://registry:5000"
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    depends_on:
      - registry
    restart: always

# Volume persistant pour stocker les images du registry
# -------------------------------------------------------
volumes:
  registry_data:
